[package]
name = "esp-soc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The machine around an Espressif SoC: scheduler, device time, console, scripts, web push, loaders, boards — generic over the chip"

[dependencies]
emu-core = { path = "../emu-core" }
esp-periph = { path = "../esp-periph" }
hmac = "0.12"
sha2 = "0.10"
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "hash2curve"] }
num-bigint = "0.4"
num-traits = "0.2"
zeroize = "1"

[features]
wasm-cpu-profile = []
